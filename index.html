<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Web BLE App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
</head>


<body>
  <div class="container">
    <!--<h1>Biogenius</h1>
    <p>Ce texte reste parfaitement opaque tandis que l'image de fond est transparente.</p> -->
    <div class="content">
    <!-- <img src="BioGenius.png" alt="Biogenius" style="float:left;width:42px;height:42px;">
     <img src="BioGenius.png" alt="Trulli" width="30" height="30"> -->
    <div class="right-panel">
        <button id="stopButton" class="onButton">Stop motors</button>

    <div class="control-panel">
      <div class="left-panel">
        <div class="button-row">
          <button id="connectBleButton" class="connectButton">Connect</button>
          <button id="disconnectBleButton" class="disconnectButton">Disconnect</button>
          <button id="resetButton" class="offButton">Reset</button>     
        </div>

        <div class="status-box">
          <p class="gray-label">
            BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong>
          </p>
        </div>

        <div class="button-row">
            <form id="userDataForm">
                <label for="Height">Height (m):</label>
                <input type="number" id="height" name="height" class ="small-input" min="1.5" step="0.01" value = "1.5">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" class = "small-input" min="50" step = "0.1" value = "50"><br><br>
                <input type="submit" value="Submit">
            </form>

            <!--<p id=""userDataState">No data sent yet.</p>-->
        </div>


        <div class="button-row">
            <button id="openFullscreen" class="genericButton" onclick="openFullscreen();">Open Fullscreen</button>
            <button id="closeFullscreen" class="genericButton" onclick="closeFullscreen();">Close Fullscreen</button>
            <!--<img src="BioGenius.png" alt="Biogenius" style="float:left;width:55px;height:55px;">-->
            <div id="battery">
                <div id="charge"></div>
                <div id="charge-level"></div>
            </div>   
            <!--<img src="BioGenius.png" alt="Trulli" width="55" height="55">-->
        </div>
        </div>     
      </div>
    
    </div>
  </div>
  </div>
</body>
<script>
    var elem = document.documentElement;
    function openFullscreen() {
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari */
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
            elem.msRequestFullscreen();
        }
    }

    function closeFullscreen() {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { /* Safari */
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) { /* IE11 */
            document.msExitFullscreen();
        }
    }
    // DOM Elements
    const connectButton = document.getElementById('connectBleButton');
    const disconnectButton = document.getElementById('disconnectBleButton');
    const stopButton = document.getElementById('stopButton');
    const resetButton = document.getElementById('resetButton');
    const retrievedValue = document.getElementById('valueContainer');
    const latestValueSent = document.getElementById('valueSent');
    const bleStateContainer = document.getElementById('bleState');
    const timestampContainer = document.getElementById('timestamp');
    const chargeLevel = document.getElementById("charge-level");
    const charge = document.getElementById("charge");

    const userDataForm = document.getElementById("userDataForm");
    const userDataState = document.getElementById("userDataState");


    //Define BLE Device Specs
    var deviceName ='BioGenius';
    var bleService = '19b10000-e8f2-537e-4f6c-d104768a1214';
    var receiveCharacteristic = '19b10002-e8f2-537e-4f6c-d104768a1214';
    var sendCharacteristic= '19b10001-e8f2-537e-4f6c-d104768a1214';

    //Global Variables to Handle Bluetooth
    var bleServer;
    var bleServiceFound;
    var sendCharacteristicFound;

    // Connect Button (search for BLE Devices only if BLE is available)
    connectButton.addEventListener('click', (event) => {
        if (isWebBluetoothEnabled()){
            connectToDevice();
        }
    });

    // Disconnect Button
    disconnectButton.addEventListener('click', disconnectDevice);

    // Write to the ESP32 receive Characteristic
    stopButton.addEventListener('click', () => writeOnCharacteristic("1","1"));
    resetButton.addEventListener('click', () => writeOnCharacteristic("1","2"));

    //envoi taille et poids

    userDataForm.addEventListener("submit", () => {
        event.preventDefault(); // Prevent form from submitting normally
        sendUserData();
    })
    
    async function sendUserData() {
        const height = (document.getElementById("height").value)*100;
        const weight = document.getElementById("weight").value;
        const userDataState = document.getElementById("userDataState");
        writeOnCharacteristic(2, height);
        sleep(500).then(() => (writeOnCharacteristic(3,weight))); //a faire :essaye sans le sleep et just avec .then
    }

    // Check if BLE is available in your Browser
    function isWebBluetoothEnabled() {
        if (!navigator.bluetooth) {
            console.log('Web Bluetooth API is not available in this browser!');
            bleStateContainer.innerHTML = "Web Bluetooth API is not available in this browser/device!";
            return false
        }
        console.log('Web Bluetooth API supported in this browser.');
        return true
    }

    // Connect to BLE Device and Enable Notifications
    function connectToDevice(){
        console.log('Initializing Bluetooth...');
        navigator.bluetooth.requestDevice({
            filters: [{name: deviceName}],
            optionalServices: [bleService]
        })
        .then(device => {
            console.log('Device Selected:', device.name);
            bleStateContainer.innerHTML = 'Connected to device ' + device.name;
            bleStateContainer.style.color = "#24af37";
            device.addEventListener('gattserverdisconnected', onDisconnected);
            return device.gatt.connect();
        })
        .then(gattServer =>{
            bleServer = gattServer;
            console.log("Connected to GATT Server");
            return bleServer.getPrimaryService(bleService);
        })
        .then(service => {
            bleServiceFound = service;
            console.log("Service discovered:", service.uuid);
            return service.getCharacteristic(sendCharacteristic);
        })
        .then(characteristic => {
            console.log("Characteristic discovered:", characteristic.uuid);
            sendCharacteristicFound = characteristic;
            characteristic.addEventListener('characteristicvaluechanged', handleCharacteristicChange);
            characteristic.startNotifications();
            console.log("Notifications Started.");
            return characteristic.readValue();
        })
        .then(value => {
            console.log("Read value: ", value);
            const decodedValue = new TextDecoder().decode(value);
            console.log("Decoded value: ", decodedValue);
            retrievedValue.innerHTML = decodedValue;
        })
        .catch(error => {
            console.log('Error: ', error);
        })
    }

    function onDisconnected(event){
        console.log('Device Disconnected:', event.target.device.name);
        bleStateContainer.innerHTML = "Device disconnected";
        bleStateContainer.style.color = "#d13a30";

        connectToDevice();
    }

    function handleCharacteristicChange(event){
        const newValueReceived = new TextDecoder().decode(event.target.value);
        let batteryLevel = `${parseInt(newValueReceived)}%`;
        charge.style.width = batteryLevel;
        chargeLevel.textContent = batteryLevel;
        console.log("Characteristic value changed: ", newValueReceived);
    }

    function writeOnCharacteristic(type,value){
        if (bleServer && bleServer.connected) {
            bleServiceFound.getCharacteristic(receiveCharacteristic)
            
            .then(characteristic => {
                length = String(value).length;
                console.log("Found the characteristic: ", characteristic.uuid);
                const stringToSend = length.toString(10) + ';' + type.toString(10) + ';' + value.toString(10) + '$';
                let encoder = new TextEncoder(); // Encode string to bytes
                let data = encoder.encode(stringToSend); 
                console.log(data)
                return characteristic.writeValue(data);
            })
            .then(() => {
                latestValueSent.innerHTML = value;
                console.log("Value written to receive characteristic:", value);
            })
            .catch(error => {
                console.error("Error writing to the receive characteristic: ", error);
            });
        } else {
            console.error ("Bluetooth is not connected. Cannot write to characteristic.")
            window.alert("Bluetooth is not connected. Cannot write to characteristic. \n Connect to BLE first!")
        }
    }

    function disconnectDevice() {
        console.log("Disconnect Device.");
        if (bleServer && bleServer.connected) {
            if (sendCharacteristicFound) {
                sendCharacteristicFound.stopNotifications()
                    .then(() => {
                        console.log("Notifications Stopped");
                        return bleServer.disconnect();
                    })
                    .then(() => {
                        console.log("Device Disconnected");
                        bleStateContainer.innerHTML = "Device Disconnected";
                        bleStateContainer.style.color = "#d13a30";

                    })
                    .catch(error => {
                        console.log("An error occurred:", error);
                    });
            } else {
                console.log("No characteristic found to disconnect.");
            }
        } else {
            // Throw an error if Bluetooth is not connected
            console.error("Bluetooth is not connected.");
            window.alert("Bluetooth is not connected.")
        }
    }

    function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
    }

</script>

</html>
